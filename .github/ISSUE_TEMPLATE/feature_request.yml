name: Feature request
description: Suggest an idea for kmprofiler
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that kmprofiler does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Include example DSL if relevant.
      placeholder: |
        kmprofiler {
            // your proposed DSL
        }
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
