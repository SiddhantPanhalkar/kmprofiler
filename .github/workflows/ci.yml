name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  plugin-tests:
    name: Plugin — Unit & Functional Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run plugin unit and functional tests
        run: ./gradlew :plugin:test --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: plugin/build/reports/tests/test/

      - name: Smoke-test Maven Local publication
        run: ./gradlew :plugin:publishToMavenLocal --console=plain