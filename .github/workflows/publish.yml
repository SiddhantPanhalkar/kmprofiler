name: Publish Plugin to Gradle Plugin Portal

on:
  release:
    types: [ published ]

jobs:
  publish:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: publish-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check release tag and plugin version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH (received $RELEASE_TAG)"
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          project_version="$(./gradlew :plugin:properties --console=plain | awk -F': ' '$1 == "version" { print $2; exit }')"
          if [ "$project_version" != "$tag_version" ]; then
            echo "Release tag $tag_version does not match plugin version $project_version"
            exit 1
          fi

      - name: Run tests and validate publication
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :plugin:test :plugin:publishPlugins --validate-only --no-configuration-cache --console=plain

      - name: Publish plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :plugin:publishPlugins --no-configuration-cache --console=plain
